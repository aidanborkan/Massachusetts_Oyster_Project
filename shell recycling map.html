  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWlkYW5qYiIsImEiOiJjbWV1YTUwd2MwMDJ0Mm1xMmJ4aGx5c2k4In0.2YPGXb3rTY1xEkdkZLxlBA';
    const STYLE = 'mapbox://styles/aidanjb/cmeuap7d2001701s65sd92ufi?fresh=true';

    const map = new mapboxgl.Map({
      container: 'map',
      style: STYLE,
      center: [-71.8, 42.2],
      zoom: 7.5
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    const MA_BOUNDS = [[-73.55, 41.18], [-69.86, 42.89]];

    map.on('load', () => {
      map.fitBounds(MA_BOUNDS, { padding: 40 });
      map.setMaxBounds([[-74.2, 40.9], [-69.2, 43.3]]);

      // Exact layer ids from your style
      const LAYERS = {
        recycling:  'layer-24-7-shell-recycling-st-8xfv9w',
        restaurants:'participating-restaurants-8q4xbw',
        upwellers:  'upwellers-40nzuv',
        upwellersDup: 'upwellers-40nzuv (1)',
        shellAging: 'shell-aging-stations-8v46hj',
        shellAgingDup: 'shell-aging-stations-8v46hj (1)'
      };

      // Hide everything except recycling (hide duplicates too)
      [LAYERS.restaurants, LAYERS.upwellers, LAYERS.upwellersDup, LAYERS.shellAging, LAYERS.shellAgingDup].forEach(id => {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
      });

      // ---------- helpers ----------
      const hoverPopup = new mapboxgl.Popup({ closeButton:false, closeOnClick:false, className:'tooltip' });
      const esc = s => String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      const getProp = (p, keys) => { for (const k of keys) if (p && p[k] != null && String(p[k]).trim() !== '') return String(p[k]); return null; };
      const pickLabel = p => getProp(p, ['Name','name','Title','title','Label','label','Site','site','Station','station','Facility','facility']) || 'Location';
      function pickAddress(p){
        let a = getProp(p, ['Address','address','Street Address','StreetAddress','Address 1','Address1','Full Address','Full_Address','Location']);
        if (a) return a;
        const street = getProp(p, ['Street','street','AddressLine1','Address line 1']);
        const city   = getProp(p, ['City','city','Town','town']);
        const state  = getProp(p, ['State','state','ST','st']);
        const zip    = getProp(p, ['Zip','ZIP','zipcode','PostalCode','postal_code']);
        const parts  = [street, city, [state, zip].filter(Boolean).join(' ')].filter(Boolean);
        return parts.length ? parts.join(', ') : null;
      }
      function pickPhone(p){
        let ph = getProp(p, ['Phone','phone','Telephone','telephone','tel','Phone Number','phone_number']);
        if (ph) return ph;
        const re = /\+?1?[\s.-]?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/;
        for (const k in p) if (typeof p[k]==='string' && re.test(p[k])) return p[k].match(re)[0];
        return null;
      }
      function pickWebsite(p){
        let w = getProp(p, ['Website','website','URL','url','Link','link','Web','web']);
        if (!w) { const re=/(https?:\/\/[^\s<>"']+)/i; for (const k in p) if (typeof p[k]==='string' && re.test(p[k])) { w=p[k].match(re)[0]; break; } }
        if (!w) return null; if (!/^https?:\/\//i.test(w)) w='https://'+w; return w;
      }
      function buildPopupHTML(p){
        const rows = [];
        const title = esc(pickLabel(p));
        const addr  = pickAddress(p); if (addr)  rows.push(`<div><strong>Address:</strong> ${esc(addr)}</div>`);
        const web   = pickWebsite(p); if (web)   rows.push(`<div><strong>Website:</strong> <a href="${esc(web)}" target="_blank" rel="noopener">${esc(web)}</a></div>`);
        const phone = pickPhone(p);   if (phone) rows.push(`<div><strong>Phone:</strong> <a href="tel:${esc(phone)}">${esc(phone)}</a></div>`);
        return `<div style="min-width:220px"><div style="font-weight:700;margin-bottom:4px">${title}</div>${rows.join('')}</div>`;
      }
      function wireHoverClick(layerId){
        const AUTO_ZOOM = 12, FLY_SPEED = 1.2;
        map.on('mousemove', layerId, (e) => {
          const f = e.features && e.features[0]; if (!f) return;
          const name = pickLabel(f.properties);
          const addr = pickAddress(f.properties);
          const html = addr
            ? `<div style="min-width:200px"><div style="font-weight:700;margin-bottom:2px">${esc(name)}</div><div>${esc(addr)}</div></div>`
            : `<div>${esc(name)}</div>`;
          hoverPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', layerId, () => { hoverPopup.remove(); map.getCanvas().style.cursor = ''; });
        map.on('click', layerId, (e) => {
          const f = e.features && e.features[0]; if (!f) return;
          new mapboxgl.Popup().setLngLat(f.geometry.coordinates).setHTML(buildPopupHTML(f.properties)).addTo(map);
          map.flyTo({ center: f.geometry.coordinates, zoom: AUTO_ZOOM, speed: FLY_SPEED, curve: 1.42, essential: true });
        });
      }

      // ---------- Register the icon from the legend <img> ----------
      const ICON_DATA = document.getElementById('lg-rec-img')?.src;
      const img = new Image();
      img.onload = () => {
        if (!map.hasImage('recycle-icon')) map.addImage('recycle-icon', img, { pixelRatio: 2 });
        addRecycleSymbol();
      };
      img.src = ICON_DATA;

      // ---------- Add the symbol layer (big icons) ----------
      function addRecycleSymbol(){
        const baseId = LAYERS.recycling;
        const base = map.getLayer(baseId);
        if (!base) { console.warn('Recycling layer not found in style:', baseId); return; }

        const srcId    = base.source;
        const srcLayer = base['source-layer'];
        const baseFilter = map.getFilter(baseId) || null;
        const symId   = baseId + '-symbol';

        if (!map.getLayer(symId)) {
          map.addLayer({
            id: symId,
            type: 'symbol',
            source: srcId,
            ...(srcLayer ? { 'source-layer': srcLayer } : {}),
            layout: {
              'icon-image': 'recycle-icon',
              'icon-size': ['interpolate', ['linear'], ['zoom'], 6, 1.6, 10, 2.4, 13, 3.2],
              'icon-allow-overlap': true,
              'icon-ignore-placement': true,
              'icon-anchor': 'bottom'
            },
            filter: baseFilter
          });
          map.moveLayer(symId);
        }

        // Hide the original circles, wire events + legend toggle
        map.setLayoutProperty(baseId, 'visibility', 'none');
        wireHoverClick(symId);

        const chk = document.getElementById('lg-rec');
        if (chk && !chk._wired) {
          chk.addEventListener('change', e => {
            const vis = e.target.checked ? 'visible' : 'none';
            if (map.getLayer(symId)) map.setLayoutProperty(symId, 'visibility', vis);
          });
          chk._wired = true;
        }
      }
    });

    map.on('error', (e) => console.warn('Map error:', e && e.error));
  </script>
</body>
</html>
