<script>
(function() {
  const mapDiv = document.getElementById('mapFig');
  const barDiv = document.getElementById('barFig');
  const resetBtn = document.getElementById('resetFilter');

  if (!mapDiv || !barDiv) return;

  function filterBarByRestaurant(name) {
    // Set visibility: only the selected restaurant visible; keep the totals text trace (last one) visible.
    const traces = barDiv.data.length;
    const lastIdx = traces - 1; // totals labels trace
    const vis = [];
    for (let i = 0; i < traces; i++) {
      if (i === lastIdx) { vis.push(true); continue; }
      const trace = barDiv.data[i];
      const rName = (trace.legendgroup || trace.name || "").toString();
      vis.push(rName === name);
    }
    Plotly.restyle(barDiv, {visible: vis});
    // Update title subtitle
    const subtitle = document.getElementById('subtitle');
    if (subtitle) subtitle.textContent = "Filtered: " + name;
  }

  function resetBar() {
    const traces = barDiv.data.length;
    const vis = Array(traces).fill(true);
    Plotly.restyle(barDiv, {visible: vis});
    const subtitle = document.getElementById('subtitle');
    if (subtitle) subtitle.textContent = "All Restaurants";
  }

  mapDiv.on('plotly_click', function(ev) {
    try {
      if (!ev || !ev.points || !ev.points[0]) return;
      // Our map customdata[0] holds the Restaurant name
      const cd = ev.points[0].customdata || [];
      const name = (cd[0] || "").toString();
      if (name) filterBarByRestaurant(name);
    } catch(e) { console.warn(e); }
  });

  if (resetBtn) resetBtn.addEventListener('click', resetBar);
})();
</script>
